<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Farm Adventure Spiel-Loop</title>
  <desc id="desc">Eine animierte Pixel-Figur bewegt sich zwischen Eingabe, Welt und Rendering.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b42"/>
      <stop offset="1" stop-color="#0c2028"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { fill: #e8f1d4; font: 700 16px monospace; letter-spacing: 1px; }
      .small { fill: #91b7aa; font: 13px monospace; }
      .panel { fill: #102b32; stroke: #39716d; stroke-width: 2; }
      .dash { fill: none; stroke: #e4b84d; stroke-width: 3; stroke-dasharray: 8 10; }
    </style>
  </defs>
  <rect width="960" height="220" rx="18" fill="url(#sky)"/>
  <path d="M0 174H960" stroke="#39716d" stroke-width="2"/>
  <g class="panel">
    <rect x="28" y="38" width="190" height="108" rx="10"/>
    <rect x="385" y="38" width="190" height="108" rx="10"/>
    <rect x="742" y="38" width="190" height="108" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="123" y="78" class="label">INPUT</text>
    <text x="123" y="104" class="small">Pfeiltaste / Werkzeug</text>
    <text x="480" y="78" class="label">WORLD</text>
    <text x="480" y="104" class="small">Actor + Objekte</text>
    <text x="837" y="78" class="label">RENDER</text>
    <text x="837" y="104" class="small">Canvas-Frame</text>
  </g>
  <path d="M228 92H370M585 92H727" class="dash"/>
  <g filter="url(#glow)">
    <rect x="0" y="151" width="14" height="14" fill="#e4b84d">
      <animate attributeName="x" values="228;370;585;727;228" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#e4b84d;#8fd17c;#e4b84d;#8fd17c;#e4b84d" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(448 131)">
    <rect x="0" y="0" width="64" height="28" fill="#6ca05b"/>
    <rect x="8" y="-8" width="12" height="12" fill="#a7d070"/>
    <rect x="44" y="7" width="12" height="12" fill="#3c704b"/>
  </g>
  <text x="480" y="199" text-anchor="middle" class="small">requestAnimationFrame · update · draw</text>
</svg>
